<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Property in [Area Name] | Limited Units</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Global Tailwind Config -->
    <script src="assets/js/tailwind-config.js"></script>

    <!-- Global Tracking (Meta & GA4) -->
    <script src="assets/js/tracking.js"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-900">

    <section class="relative h-[60vh] flex items-center justify-center bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1560518883-ce09059eeffa?auto=format&fit=crop&w=1200&q=80');">
        <div class="absolute inset-0 bg-black opacity-50"></div>
        <div class="relative z-10 text-center px-4">
            <h1 class="text-3xl md:text-5xl font-bold text-white mb-4">Luxury 2 & 3 BHK in [Location]</h1>
            <p class="text-xl text-gray-200 mb-8">Starting at ₹[Price] Cr* | Ready to Move</p>
            <a href="#enquire" class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 px-8 rounded-full transition duration-300">Download Brochure</a>
        </div>
    </section>

    <section class="py-12 px-4 max-w-5xl mx-auto grid grid-cols-2 md:grid-cols-4 gap-6 text-center">
        <div class="p-4 bg-white shadow-sm rounded-lg border border-gray-100">
            <p class="text-sm text-gray-500 uppercase">Possession</p>
            <p class="font-bold text-lg">Dec 2026</p>
        </div>
        <div class="p-4 bg-white shadow-sm rounded-lg border border-gray-100">
            <p class="text-sm text-gray-500 uppercase">Area</p>
            <p class="font-bold text-lg">1200 - 1800 sqft</p>
        </div>
        <div class="p-4 bg-white shadow-sm rounded-lg border border-gray-100">
            <p class="text-sm text-gray-500 uppercase">Amenities</p>
            <p class="font-bold text-lg">20+ Premium</p>
        </div>
        <div class="p-4 bg-white shadow-sm rounded-lg border border-gray-100">
            <p class="text-sm text-gray-500 uppercase">Location</p>
            <p class="font-bold text-lg">Near [Landmark]</p>
        </div>
    </section>

    <section id="enquire" class="py-16 bg-white px-4">
        <div class="max-w-md mx-auto">
            <h2 class="text-2xl font-bold mb-6 text-center">Express Your Interest</h2>
            <form id="leadForm" class="space-y-4">
                <input type="text" placeholder="Full Name" required class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
                <input type="tel" placeholder="Mobile Number" required class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
                <select class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
                    <option>Select Configuration</option>
                    <option>2 BHK</option>
                    <option>3 BHK</option>
                </select>
                <button type="submit" class="w-full bg-blue-900 text-white font-bold py-4 rounded-lg hover:bg-blue-800 transition">Unlock Pricing & Plans</button>
            </form>
        </div>
    </section>

    <div class="fixed bottom-0 left-0 right-0 p-4 md:hidden bg-gradient-to-t from-white to-transparent">
        <a onclick="trackWhatsApp()" href="https://wa.me/[YourNumber]?text=I'm%20interested%20in%20[Property]" class="flex items-center justify-center bg-[#25D366] text-white font-bold py-3 rounded-full shadow-2xl">
            <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" class="w-6 h-6 mr-2" alt="WA">
            Chat on WhatsApp
        </a>
    </div>

    <script>
        // Track Form Submission
        document.getElementById('leadForm').onsubmit = function(e) {
            e.preventDefault();
            fbq('track', 'Lead'); // Fire Meta Lead Event
            alert('Details Sent! We will contact you shortly.');
        };

        // Track WhatsApp Click
        function trackWhatsApp() {
            fbq('track', 'Contact'); // Fire Meta Contact Event
        }
    </script>

</body>
</html>
